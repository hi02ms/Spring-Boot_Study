plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1' // Spring Boot 4.1.1 사용
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'springstudy'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21) // 이 프로젝트가 Java 21을 사용
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc' // Spring Web 기능이 실제 의존성으로 들어가 있음
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
